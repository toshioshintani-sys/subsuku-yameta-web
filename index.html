    <!--
      Google Search Console の所有権確認 meta タグはここに貼り付ける：
      <meta name="google-site-verification" content="..." />
      取得方法：search.google.com/search-console → プロパティ追加（URLプレフィックス）→
      HTMLタグ方式を選択して表示される content="..." を上に差し込み、再デプロイ
    -->

    <!--
      AdSense サイト接続（support.google.com/adsense/answer/7584263 の方式1＋メタタグ併用）。
      2026-06-13 有効化：審査が「準備中」から進まない原因が「コードが全てコメントアウト状態＝
      Google審査クローラから不可視」だったため。承認前は広告が出ないだけで無害。
      プリレンダ中は scripts/prerender.mjs の BLOCK 正規表現がリクエストを遮断（ポリシー順守）。
    -->
    <meta name="google-adsense-account" content="ca-pub-0787387437486917" />
    <!-- id は AdSlot.jsx の二重注入ガード（getElementById('adsense-script')）と整合させる -->

      id="adsense-script"
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0787387437486917"
      crossorigin="anonymous"
    ></script>
