<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ワールドカップ2026 どこで見る 無料で見る早見表">
  <defs>
    <style>
      text { font-family: 'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif; }
      .ttl { fill:#1a2440; font-weight:800; }
      .sub { fill:#0a7c7c; font-weight:700; }
      .free-h { fill:#fbf8f3; font-weight:800; }
      .free-k { fill:#0a7c7c; font-weight:800; }
      .free-t { fill:#1a2440; font-weight:600; }
      .free-s { fill:#42707a; font-weight:500; }
      .paid-h { fill:#1a2440; font-weight:800; }
      .paid-t { fill:#1a2440; font-weight:600; }
      .paid-s { fill:#7a5a4d; font-weight:500; }
      .band { fill:#fbf8f3; font-weight:700; }
      .foot { fill:#5a6275; font-weight:600; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#fbf8f3"/>
  <rect x="0" y="0" width="14" height="630" fill="#0a7c7c"/>

  <!-- タイトル -->
  <text x="56" y="74" class="ttl" font-size="46" letter-spacing="1">ワールドカップ2026、どこで見る？</text>
  <text x="58" y="116" class="sub" font-size="25">まず「無料で見る」早見表 — 必要な人だけ課金</text>

  <!-- 左：無料で見る（主役・大） -->
  <rect x="56" y="150" width="640" height="332" rx="20" fill="#0a7c7c"/>
  <rect x="56" y="150" width="640" height="64" rx="20" fill="#0a7c7c"/>
  <rect x="56" y="182" width="640" height="32" fill="#0a7c7c"/>
  <text x="84" y="196" class="free-h" font-size="30">無料で見る</text>
  <text x="640" y="197" class="free-h" font-size="40" text-anchor="end" opacity="0.95">¥0</text>

  <!-- 区切り -->
  <line x1="84" y1="226" x2="668" y2="226" stroke="#fbf8f3" stroke-width="1.5" opacity="0.35"/>

  <!-- 項目1 -->
  <circle cx="98" cy="262" r="6" fill="#fbf8f3"/>
  <text x="120" y="270" class="free-h" font-size="25">日本代表戦</text>
  <text x="120" y="300" class="free-s" font-size="19" fill="#cfeaea">DAZNで無料ライブ配信 ＋ 地上波でも生中継</text>

  <!-- 項目2 -->
  <circle cx="98" cy="338" r="6" fill="#fbf8f3"/>
  <text x="120" y="346" class="free-h" font-size="25">地上波（無料）</text>
  <text x="120" y="376" class="free-s" font-size="19" fill="#cfeaea">NHK総合 33試合 ・ 日テレ 15試合 ・ フジ 10試合（予定）</text>

  <!-- 項目3 -->
  <circle cx="98" cy="414" r="6" fill="#fbf8f3"/>
  <text x="120" y="422" class="free-h" font-size="25">NHK BS4K</text>
  <text x="120" y="452" class="free-s" font-size="19" fill="#cfeaea">全104試合を放送（生中継または録画）</text>

  <!-- 右：全部見るなら（有料・控えめ） -->
  <rect x="720" y="150" width="424" height="332" rx="20" fill="#ffffff" stroke="#e3ded5" stroke-width="2"/>
  <text x="748" y="196" class="paid-h" font-size="27">全部見るなら（有料）</text>
  <line x1="748" y1="216" x2="1116" y2="216" stroke="#e3ded5" stroke-width="1.5"/>

  <text x="748" y="266" class="paid-t" font-size="24">DAZN <tspan fill="#b85c3d" font-weight="800">月4,200円</tspan></text>
  <text x="748" y="296" class="paid-s" font-size="18">全104試合をネットでフル視聴したい人向け</text>

  <rect x="748" y="330" width="368" height="124" rx="14" fill="#fbf3ef"/>
  <text x="770" y="370" class="paid-h" font-size="22" fill="#b85c3d">かしこい手</text>
  <text x="770" y="404" class="paid-t" font-size="21">大会だけ契約 → 終わったら解約</text>
  <text x="770" y="432" class="paid-s" font-size="17">締め日前に手続き。入りっぱなしを避ける</text>

  <!-- 下帯：日本戦日程 -->
  <rect x="56" y="502" width="1088" height="58" rx="14" fill="#1a2440"/>
  <text x="84" y="538" class="band" font-size="20" fill="#7fd4d4">日本戦</text>
  <text x="168" y="538" class="band" font-size="20">6/15 オランダ　•　6/21 チュニジア　•　6/26 スウェーデン　<tspan fill="#aab4c8" font-weight="500">（日本時間）</tspan></text>

  <!-- フッター -->
  <g transform="translate(56,596)">
    <!-- 小さなはさみ（紐を切る＝サブスクを切る） -->
    <g stroke="#0a7c7c" stroke-width="2.2" fill="none" stroke-linecap="round">
      <circle cx="6" cy="2" r="5"/>
      <circle cx="6" cy="16" r="5"/>
      <path d="M10 -2 L26 9"/>
      <path d="M10 20 L26 9"/>
      <path d="M26 9 L40 9"/>
    </g>
    <text x="52" y="14" class="foot" font-size="19">サブスクやめた</text>
    <text x="186" y="14" class="foot" font-size="17" fill="#9aa1b0">｜ sabusuku.netlify.app</text>
  </g>
  <text x="1144" y="610" class="foot" font-size="14" text-anchor="end" fill="#aab4c8">最新の放送・料金は各公式でご確認ください</text>
</svg>
