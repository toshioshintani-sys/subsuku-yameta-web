# Netlify build configuration for サブスクやめた
#
# 重要なポイント：
# - SPA リダイレクト（最下部）が無いと /about や /service/:id などの
#   サブルートを直接開いたとき Netlify が 404 を返す
# - NODE_VERSION を固定して Netlify のデフォルト変更による事故を防ぐ

[build]
  # ラッパー経由でビルド：失敗時に実エラー末尾を Slack（env: BUILD_FAILURE_WEBHOOK）へ自動通知。
  # 2026-06-03〜11 にビルド全敗が9日間無通知だった事故の再発防止（自律運用ルール原則7）。
  command = "node scripts/netlify-build.mjs"
  publish = "dist"
  # ビルド要否の自動判定（2026-08-26）。台帳(scripts/price-watch/state)・docs・md だけの
  # push はビルドせずデプロイもしない＝クレジットを消費しない。実測で直近30pushの16回が
  # 表示の変わらない無駄なデプロイ（≒240クレジット）だった。判定ロジックと理由は
  # scripts/netlify-ignore.sh に。exit 0=スキップ / exit 1=ビルド。
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline --no-audit"
  # AdSense再審査中の一時措置（docs/ADSENSE_REAPPROVAL_PLAN.md P3・俊雄さんYES承認2026-07-02）。
  # true の間、全アフィリエイトリンクが元URL（非収益化）にフォールバックする（src/data/affiliates.js）。
  # 承認が下りたら false に戻す（Netlify環境変数 VITE_REVIEW_MODE を上書き設定すればここより優先される）。
  VITE_REVIEW_MODE = "true"

# 静的アセットに長期キャッシュを設定（Vite はファイル名にハッシュを含めるので安全）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 旧 netlify.app サブドメイン → 独自ドメインへ 301（重複URL統合・移行・GSCアドレス変更の前提）
# force=true でないと SPA フォールバック(/*)に先に拾われて 200 を返してしまう。必ず SPA より前に置く。
[[redirects]]
  from = "https://sabusuku.netlify.app/*"
  to = "https://sabusuku-yameta.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sabusuku.netlify.app/*"
  to = "https://sabusuku-yameta.com/:splat"
  status = 301
  force = true

# SPA フォールバック：React Router のルートを Netlify でも有効化する
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
