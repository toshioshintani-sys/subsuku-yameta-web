# Netlify build configuration for サブスクやめた
#
# 重要なポイント：
# - SPA リダイレクト（最下部）が無いと /about や /service/:id などの
#   サブルートを直接開いたとき Netlify が 404 を返す
# - NODE_VERSION を固定して Netlify のデフォルト変更による事故を防ぐ

[build]
  # ラッパー経由でビルド：失敗時に実エラー末尾を Slack（env: BUILD_FAILURE_WEBHOOK）へ自動通知。
  # 2026-06-03〜11 にビルド全敗が9日間無通知だった事故の再発防止（自律運用ルール原則7）。
  command = "node scripts/netlify-build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline --no-audit"

# 静的アセットに長期キャッシュを設定（Vite はファイル名にハッシュを含めるので安全）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 旧 netlify.app サブドメイン → 独自ドメインへ 301（重複URL統合・移行・GSCアドレス変更の前提）
# force=true でないと SPA フォールバック(/*)に先に拾われて 200 を返してしまう。必ず SPA より前に置く。
[[redirects]]
  from = "https://sabusuku.netlify.app/*"
  to = "https://sabusuku-yameta.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sabusuku.netlify.app/*"
  to = "https://sabusuku-yameta.com/:splat"
  status = 301
  force = true

# SPA フォールバック：React Router のルートを Netlify でも有効化する
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
